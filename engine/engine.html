<meta charset="utf-8">
<title>Writing Room</title>
<!-- Writing Room · Bernhard Gmeiner · https://bernhardgmeiner.com · CC BY-NC-SA 4.0. Fonts are embedded by tools/build.js (no network requests). -->
<!--__FONTS__-->
<style>
/* Layout: projector board. Library -> setup -> one task per screen (decide: option cards, copy: the growing text page) -> finished text in its real layout.
   Deliberately one light look: projectors wash out dark themes, so every colour is set explicitly here.
   The reading text scales with --zoom (A+/A-); the chrome does not. Decide cards are sized by fitDecide (zoom only sets the ceiling). */
/* Digits from a system face: Atkinson Hyperlegible only has a slashed zero, which Austrian students read as "Durchschnitt". */
@font-face{font-family:"WR Digits"; src:local("Segoe UI"), local("Arial"), local("Helvetica"), local("Liberation Sans"); unicode-range:U+0030-0039;}
:root{
  color-scheme: light;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#12161D; --ink-soft:#434C5A; --line:#8E99A8; --line-soft:#B9C2CE;
  --hl:#FFE45C; --hl-edge:#9C7600; --ok:#17784A; --ok-soft:#DFF3E8; --no:#C0262D; --no-soft:#FBE3E4;
  --pv:#17784A; --sc:#1F4FB5; --sc-soft:#E3ECFF; --own:#7A4E00;
  /* card colours: colour-blind safe, white letters >= 4.3:1 */
  --A:#1F5FD1; --B:#C45A00; --C:#007A5E; --D:#B0287A;
  --A-txt:#1F5FD1; --B-txt:#A84F00; --C-txt:#007A5E; --D-txt:#B0287A;
  --f-display:"Bricolage Grotesque","Segoe UI",Arial,sans-serif;
  --f-body:"WR Digits","Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
  --f-text:"Literata",Georgia,"Times New Roman",serif;
  --zoom:1;
  /* side panel and REJECTED window follow A+ only up to 1.2 (1.0 in low windows: 720p full screen, 1024×768), so their buttons stay on the board at zoom 1.6 */
  --pz:min(var(--zoom), 1.2);
  /* boundary of the search field and the selects: >= 3:1 on white and on the page background (WCAG 1.4.11) */
  --line-field:#808B9B;
}
@media (max-height: 779px){ :root{--pz:min(var(--zoom), 1);} }
html{font-size:clamp(16px, 0.9vw + 6px, 30px); scrollbar-gutter:stable;}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); line-height:1.45; margin:0; padding-inline:16px;}
*{box-sizing:border-box;}
button{font:inherit; color:inherit;}
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible{outline:3px solid var(--A); outline-offset:3px;}
.app{max-width:1800px; margin:0 auto; padding-block:8px 28px; display:flex; flex-direction:column; gap:10px;}
.app.deciding{padding-bottom:6px; gap:8px;}
[hidden]{display:none!important;}
#main h1:focus{outline:none;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;}
[tabindex="-1"]:focus{outline:none;}
.num{font-family:var(--f-text); font-variant-numeric:tabular-nums lining-nums; font-weight:700;}

/* ---------- top bar (fixed size, not zoomed): row 1 brand + tools, row 2 steps ---------- */
.top{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"brand tools" "steps steps"; align-items:center; gap:6px 14px; border-bottom:3px solid var(--ink); padding-bottom:6px; font-size:clamp(14px, 0.45vw + 9px, 20px);}
.brand{grid-area:brand; font-family:var(--f-display); font-weight:800; font-size:1.5em; letter-spacing:-.01em; white-space:nowrap; display:flex; align-items:baseline; gap:10px; min-width:0; overflow:hidden;}
.brand small{font-family:var(--f-body); font-weight:700; font-size:.55em; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.brand small.by{font-size:.62em; letter-spacing:0; text-transform:none;}
.brand small.by a{color:inherit; text-decoration:none;}
.brand small.by a:hover, .brand small.by a:focus-visible{text-decoration:underline;}
.tools{grid-area:tools; display:flex; gap:5px; flex-wrap:nowrap; justify-content:flex-end;}
.tool{border:2px solid var(--line-soft); background:var(--surface); border-radius:8px; padding:3px 9px; font-size:.92em; font-weight:700; cursor:pointer; white-space:nowrap;}
.tool:hover{border-color:var(--ink-soft);}
.tool[aria-pressed="true"]{border-color:var(--pv); color:var(--pv);}
#t-focus{max-width:15em; overflow:hidden; text-overflow:ellipsis;}
.steps{grid-area:steps; display:flex; flex-wrap:nowrap; gap:5px; min-width:0; overflow-x:auto; scrollbar-width:none;}
.steps::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; font-size:.9em; font-weight:700; padding:2px 9px; border-radius:99px; border:2px solid var(--line-soft); background:var(--surface); color:var(--ink-soft); white-space:nowrap;}
.chip .nm{display:none;}
.chip.now .nm{display:inline;}
.chip.done{border-color:var(--ok); color:var(--ok);}
.chip.done::after{content:" ✓";}
.chip.now{border-color:var(--ink); background:var(--ink); color:#fff;}

/* ---------- generic ---------- */
.eyebrow{font-weight:700; font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);}
h1.q{font-family:var(--f-display); font-weight:800; font-size:clamp(1.55rem, 2.4vw, 2.1rem); line-height:1.12; margin:0 0 2px; text-wrap:balance;}
.de{color:var(--ink-soft); font-size:1.12rem; margin:0;}
.primary{display:inline-flex; align-items:center; gap:10px; border:0; background:var(--ink); color:#fff; font-weight:700; font-size:1.2rem; padding:12px 22px; border-radius:10px; cursor:pointer;}
.primary:hover{background:#2A3240;}
.secondary{border:2px solid var(--ink); background:var(--surface); font-weight:700; font-size:1.05rem; padding:10px 18px; border-radius:10px; cursor:pointer;}
.secondary:hover{background:var(--bg);}
.secondary.small{font-size:.92rem; padding:5px 12px; border-width:2px;}
.linkbtn{border:0; background:none; padding:0; color:var(--A-txt); font-weight:700; text-decoration:underline; cursor:pointer;}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center;}
.kbd{font-size:.95rem; color:var(--ink-soft);}
.card{background:var(--surface); border:2px solid var(--line-soft); border-radius:16px; padding:18px 22px; min-width:0;}
.card h2{font-family:var(--f-display); font-weight:800; font-size:1.5rem; margin:0 0 8px; text-wrap:balance;}
.badge{display:inline-block; font-weight:800; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; padding:2px 9px; border-radius:6px; background:var(--ink); color:#fff;}
.badge.lvl{background:var(--surface); color:var(--ink); border:2px solid var(--ink);}
.badge.crit{background:var(--no); color:#fff;}
.muted{color:var(--ink-soft);}
.err{color:var(--no); font-weight:700; min-height:1.2em;}
/* top centre, just below the top bar (top is set in toast()), so it never covers the options */
.toast{position:fixed; left:50%; top:80px; transform:translateX(-50%); max-width:calc(100vw - 32px); background:var(--ink); color:#fff; font-weight:700; font-size:1.1rem; padding:10px 18px; border-radius:10px; z-index:60; box-shadow:0 6px 24px rgba(0,0,0,.3);}

/* ---------- library ---------- */
.hero{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px;}
.hero h1{font-family:var(--f-display); font-weight:800; font-size:2.4rem; margin:0; line-height:1.05;}
.hero p{margin:4px 0 0; font-size:1.08rem; color:var(--ink-soft); max-width:62ch;}
details.how{background:var(--surface); border:2px solid var(--line-soft); border-radius:14px; padding:10px 16px;}
details.how summary{cursor:pointer; font-weight:800;}
details.how ol{margin:8px 0 4px; padding-left:1.4em; display:flex; flex-direction:column; gap:4px;}
details.how p{margin:6px 0 2px;}
.filters{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center;}
.filters .grp{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.filters .grp > span{font-size:.85rem; font-weight:700; color:var(--ink-soft); margin-right:2px;}
.fbtn{border:2px solid var(--line-soft); background:var(--surface); border-radius:99px; padding:3px 12px; font-weight:700; font-size:.92rem; cursor:pointer;}
.fbtn[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
.shelf{display:flex; flex-direction:column; gap:8px;}
.shelf h2{font-family:var(--f-display); font-weight:800; font-size:1.4rem; margin:8px 0 0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.shelf h2 small{font-family:var(--f-body); font-size:.95rem; color:var(--ink-soft); font-weight:700;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap:10px;}
.pk{display:flex; flex-direction:column; gap:4px; text-align:left; background:var(--surface); border:2px solid var(--line-soft); border-radius:14px; padding:12px 14px; cursor:pointer; min-width:0;}
.pk:hover{border-color:var(--ink);}
.pk .t{font-family:var(--f-display); font-weight:800; font-size:1.22rem; line-height:1.15;}
.pk .d{color:var(--ink-soft); font-size:.92rem;}
.pk .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; padding-top:4px;}
.tt{font-size:.76rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:1px 7px; border-radius:6px; border:2px solid var(--line-soft); color:var(--ink-soft);}
.tt.run{border-color:var(--hl-edge); color:var(--ink);}
.tt.th{text-transform:none; letter-spacing:0; font-weight:700; font-size:.8rem; border-style:dashed;}   /* Themenbereich: names with ":" and "&" read badly in capitals */
.pk .d.fo{color:var(--ink);}
/* Schulstufe navigation, filters, search */
/* "Alle" + 8 Schulstufen: one row of 9 on a wide board, else two rows (5 + 4) */
.grades{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px;}
@media (min-width: 1200px){ .grades{grid-template-columns:auto repeat(8, minmax(0,1fr));} }
.gchip{display:flex; flex-direction:column; align-items:flex-start; min-width:0; border:2px solid var(--line-soft); background:var(--surface); border-radius:12px; padding:5px 9px 6px; cursor:pointer; text-align:left;}
.gchip b{font-family:var(--f-display); font-weight:800; font-size:clamp(.9rem, 1.1vw, 1.12rem); line-height:1.15; white-space:nowrap;}
.gchip small{font-size:.74rem; font-weight:700; line-height:1.25; color:var(--ink-soft);}
.gchip:not(:disabled):hover{border-color:var(--ink);}
.gchip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff;}
.gchip[aria-pressed="true"] small{color:#E6EAF0;}
.gchip:disabled{opacity:.5; cursor:default;}
.fsel{display:flex; align-items:center; gap:6px; font-size:.85rem; font-weight:700; color:var(--ink-soft); min-width:0;}
.fsel select, .fsearch input{font:inherit; font-size:.95rem; font-weight:700; color:var(--ink); background:var(--surface); border:2px solid var(--line-field); border-radius:10px; padding:4px 10px; min-width:0; max-width:100%;}
.fsearch{flex:1 1 14rem; display:flex; min-width:0; max-width:26rem;}
.fsearch input{width:100%; font-weight:400;}
.fsel select:hover, .fsearch input:hover{border-color:var(--ink);}
.fsel select:focus, .fsearch input:focus{border-color:var(--A);}
.cardsrow{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin:8px 0 2px;}
a.secondary{display:inline-block; color:var(--ink); text-decoration:none;}
.foot .linkbtn{color:var(--ink-soft); font-weight:700; padding:4px 0;}
/* info window (library): German, narrow, readable */
.panel.about{max-width:min(860px, calc(100vw - 32px)); gap:8px; font-size:1.05rem;}
.brand .linkbtn.why{color:var(--ink-soft); white-space:nowrap;}
.panel.note{background:#FBF7EC; border:2px solid #E1D7BE; max-width:54rem;}
.panel.note p{font-family:var(--f-text); font-size:1.08rem; line-height:1.58; margin:9px 0 0;}
.panel.note p.sig{font-style:italic; text-align:right; margin-top:14px;}
.panel.about h3{font-family:var(--f-display); font-weight:800; font-size:1.2rem; margin:10px 0 0;}
.panel.about p{margin:0; max-width:70ch;}
.panel.about a{color:var(--A-txt); font-weight:700;}
.panel.about .muted{font-size:.95rem;}
.panel.about details.ofl summary{cursor:pointer; font-weight:700; font-size:.95rem;}
.panel.about details.ofl pre{white-space:pre-wrap; font-family:var(--f-body); font-size:.8rem; line-height:1.4; max-height:40vh; overflow:auto; margin:6px 0 0; padding:8px 12px; background:var(--bg); border-radius:8px;}
.resume{display:flex; flex-direction:column; gap:8px; background:var(--hl); border-radius:14px; padding:12px 16px;}
.resume > b{font-family:var(--f-display); font-size:1.25rem;}
.runs{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.runs li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 14px; align-items:center; border-top:2px solid rgba(18,22,29,.18); padding-top:8px;}
.runs .row{gap:8px; flex-wrap:nowrap;}
.runs .primary{font-size:1.02rem; padding:7px 14px;}
.runs .secondary{font-size:.95rem; padding:5px 12px;}
.runs li:first-child{border-top:0; padding-top:0;}
.runs .rt{min-width:0; overflow-wrap:anywhere;}
.runs .rt b{font-family:var(--f-display); font-size:1.15rem;}
.filtered{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-weight:700; color:var(--ink-soft);}

/* ---------- setup ---------- */
.setup{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start;}
.task{background:var(--surface); border:3px solid var(--ink); border-radius:16px; padding:18px 22px; overflow-wrap:anywhere;}
.task .sit{font-family:var(--f-text); font-size:calc(1.3rem * var(--zoom)); line-height:1.5; margin:6px 0 10px; white-space:pre-line;}
.task .ins{font-weight:700; font-size:calc(1.18rem * var(--zoom)); margin:0 0 4px;}
.task ul{margin:0 0 10px; padding-left:1.3em; font-family:var(--f-text); font-size:calc(1.28rem * var(--zoom)); line-height:1.5;}
.task .wds{font-weight:700; font-size:calc(1.12rem * var(--zoom)); margin:0;}
.task .tde{font-size:1rem; color:var(--ink-soft); margin:10px 0 0; border-top:2px solid var(--line-soft); padding-top:8px;}
.subde{display:block; font-size:.6em; margin-top:4px;}
.choice{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap:8px;}
.opt-c{text-align:left; border:2px solid var(--line-soft); background:var(--surface); border-radius:12px; padding:10px 12px; cursor:pointer;}
.opt-c[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
.opt-c[aria-pressed="true"] span{color:#E6EAF0;}
.opt-c[aria-pressed="true"] b::before{content:"✓ ";}
.opt-c b{display:block; font-size:1.05rem;}
.opt-c span{font-size:.92rem; color:var(--ink-soft);}
.info{font-size:1.05rem; margin:0;}
details.tn{background:var(--surface); border:2px solid var(--line-soft); border-radius:14px; padding:10px 14px;}
details.tn summary{cursor:pointer; font-weight:700;}
details.tn summary small{font-weight:400; color:var(--no);}
details.tn dl{margin:8px 0 0; display:grid; gap:6px;}
details.tn dt{font-weight:800; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);}
details.tn dd{margin:0 0 4px; font-size:1rem;}

/* ---------- decide ---------- */
.decide-head{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; align-items:flex-end;}
.part-tag{display:inline-block; font-weight:800; font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; padding:2px 10px; border-radius:6px; background:var(--ink); color:#fff; margin-bottom:4px;}
/* grades 9–12: the five paragraphs (Introduction, Body paragraph 1–3, Conclusion) are the frame of every text: the label is big on the board */
.upper .part-tag{font-family:var(--f-display); font-size:1.18rem; letter-spacing:.04em; padding:3px 12px;}
.part-tag .cont{font-weight:700; color:#E6EAF0;}
.vote{display:flex; gap:6px; align-items:center; font-weight:800; font-size:1.3rem; color:var(--ink);}
.vote.again{color:var(--no);}
.vote .vt{display:inline-grid; place-items:center; width:1.9rem; height:1.9rem; border-radius:6px; color:#fff; font-family:var(--f-display); font-weight:800; box-shadow:inset 0 0 0 3px rgba(0,0,0,.18);}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:8px;}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.optw{position:relative; display:flex; min-width:0;}
.opt{flex:1 1 auto; width:100%; display:flex; gap:10px; align-items:flex-start; text-align:left; background:var(--surface); border:3px solid var(--line-soft); border-radius:14px; padding:10px 12px 2.25rem; cursor:pointer; min-width:0;}
.mouse .opt:hover{box-shadow:0 0 0 3px var(--line-soft);}
.opt .L{flex:0 0 auto; width:2.5rem; height:2.5rem; border-radius:10px; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:1.6rem; color:#fff;}
.opt .L, .cards-demo span.c, .spothead .L{box-shadow:inset 0 0 0 3px rgba(0,0,0,.18);}
.opt .body{display:block; min-width:0;}
.opt .lbl{display:block; font-weight:700; font-size:.95rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px;}
/* option text: not multiplied by --zoom; --fit (from fitDecide) already uses the zoom as its ceiling */
.opt .txt{display:block; font-family:var(--f-text); font-size:calc(1.42rem * var(--fit,1)); line-height:1.36; overflow-wrap:normal;}
/* normal wrapping (no "Applicatio / n"): fitDecide shrinks the text until the longest word fits; only a word that never fits may break */
.opts.wrapany .opt .txt{overflow-wrap:anywhere;}
.opt.branch .txt{font-family:var(--f-body); font-size:calc(1.4rem * var(--fit,1));}
.opt.headline .txt{font-weight:700; font-size:calc(1.6rem * var(--fit,1)); line-height:1.22;}
.spotbtn{position:absolute; right:8px; bottom:6px; width:1.75rem; height:1.75rem; display:grid; place-items:center; padding:0; border:2px solid var(--line-soft); border-radius:8px; background:var(--surface); color:var(--ink-soft); font-size:1.05rem; line-height:1; cursor:pointer;}
.spotbtn:hover{border-color:var(--ink-soft); color:var(--ink);}
.opt[data-l="A"]{border-color:var(--A);} .opt[data-l="A"] .L{background:var(--A);} .opt[data-l="A"] .lbl{color:var(--A-txt);}
.opt[data-l="B"]{border-color:var(--B);} .opt[data-l="B"] .L{background:var(--B);} .opt[data-l="B"] .lbl{color:var(--B-txt);}
.opt[data-l="C"]{border-color:var(--C);} .opt[data-l="C"] .L{background:var(--C);} .opt[data-l="C"] .lbl{color:var(--C-txt);}
.opt[data-l="D"]{border-color:var(--D);} .opt[data-l="D"] .L{background:var(--D);} .opt[data-l="D"] .lbl{color:var(--D-txt);}
.opt.out{cursor:help; border-style:dashed; border-color:var(--line)!important;}
.opt.out .L{opacity:.45;}
.opt.out .txt{opacity:.75; text-decoration:line-through; text-decoration-color:rgba(192,38,45,.6); text-decoration-thickness:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.opt.out .lbl{color:var(--no)!important;}
.opt.out .lbl::after{content:"  · rejected";}
.nowrap{white-space:nowrap;}
.blank{display:inline-block; min-width:3.2em; border-bottom:3px solid currentColor; height:1em; vertical-align:baseline;}
.blank.hot{background:var(--hl);}
.blank.wide{min-width:10em;}
.context{background:var(--surface); border:2px dashed var(--line); border-radius:12px; padding:6px 14px; font-family:var(--f-text); font-size:1.02rem; color:var(--ink-soft); margin-top:6px;}
.context b{font-family:var(--f-body); font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; margin-right:8px; color:var(--ink);}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; background:rgba(18,22,29,.78); display:grid; place-items:center; padding:16px; z-index:50; overflow:auto;}
.panel{background:var(--surface); border-radius:18px; max-width:min(1500px, calc(100vw - 32px)); width:100%; padding:24px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 32px); overflow:auto;}
.panel.spotp{max-width:min(1700px, calc(100vw - 32px));}
.panel .task{border:0; padding:0;}
.panel .task .tde{display:none;}   /* T window = the task card the class saw on the task screen (without the German summary) */
.stamp{align-self:flex-start; font-family:var(--f-display); font-weight:800; font-size:2.4rem; letter-spacing:.06em; color:var(--no); border:6px solid var(--no); border-radius:12px; padding:2px 18px; transform:rotate(-4deg);}
.panel .why{font-size:calc(1.6rem * var(--pz)); line-height:1.4; margin:0;}
.panel .why-de{font-size:1.1rem; color:var(--ink-soft); margin:0;}
.panel h2{font-family:var(--f-display); font-weight:800; font-size:1.9rem; margin:0;}
.trapq{font-family:var(--f-text); font-size:calc(1.15rem * var(--pz)); line-height:1.45; border-left:6px solid var(--no); background:var(--no-soft); padding:8px 12px; margin:0; border-radius:0 8px 8px 0;}
.gapq{font-family:var(--f-text); font-size:calc(1.25rem * var(--pz)); line-height:1.45; margin:0; color:var(--ink-soft);}
.spot{font-family:var(--f-text); font-size:calc(2rem * var(--zoom)); line-height:1.42; margin:0; overflow-wrap:anywhere;}
.spot.hd{font-weight:700;}
.spot.br{font-family:var(--f-body);}

/* ===================== STATE ===================== */
// One save slot per pack: {packId: run}, at most MAX_RUNS. Runs carry `updated` (ms, last real change) and `date` (lesson day).
// Every write is a read-modify-write of this pack's entry only, so two open tabs never wipe each other's lessons.
// Version 2 uses its own keys ("wr2-"): lessons and settings of Version 1 are ignored.
const RUNS_KEY = "wr2-runs", PREF_KEY = "wr2-prefs", MAX_RUNS = 8;
// storage can be missing or throw (sandboxed frame, private mode): the app still works, it just cannot keep lessons
const STORE_OK = (() => { try{ localStorage.setItem("wr2-probe", "1"); localStorage.removeItem("wr2-probe"); return true; }catch(e){ return false; } })();

const freshRun = (packId, mode, len) => ({ packId, mode, len, date:fmtDate(Date.now()), phase:"task", si:0, picks:{}, rejected:{}, gaps:{}, last:null, revealed:false, focus:true, ticks:[], updated:Date.now(), history:[] });
let view = "library";          // library | setup | run
let setupSel = null;           // {packId, mode, len}
let R = null;                  // current run (also stored in runs[R.packId])
let runs = {};                 // saved runs, one per pack
let savedSig = {};             // packId -> runSig() of the version last read or written (unchanged = no write, no new `updated`)
let runNotes = [];             // runs dropped on load because the pack changed (shown in the library)
let redo = [];                 // undone states (not persisted); any new snapshot() clears it
let lockUntil = 0;
function packById(id){ return PACKS.find(p => p.id === id) || null; }
function activeSteps(p, len){ return p.steps.filter(s => (s.len || "both") === "both" || len === "long"); }
const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
function validRun(r){
  try{
    if(!isObj(r)) return false;
    const p = packById(r.packId); if(!p) return false;
    if(!p.modes.includes(r.mode) || !p.lengths[r.len]) return false;
    if(!["task","layout","decide","copy","final"].includes(r.phase)) return false;
    const st = activeSteps(p, r.len); if(!Number.isInteger(r.si) || r.si < 0 || r.si >= st.length) return false;
    if(!isObj(r.picks) || !isObj(r.gaps) || !isObj(r.rejected)) return false;
    if(Object.values(r.rejected).some(v => !Array.isArray(v) || v.some(x => typeof x !== "string"))) return false;
    if(Object.values(r.gaps).some(v => typeof v !== "string")) return false;
    if(typeof r.revealed !== "boolean" || typeof r.focus !== "boolean") return false;
    if(!Array.isArray(r.ticks) || r.ticks.some(x => typeof x !== "number")) return false;
    if(r.last != null && typeof r.last !== "string") return false;
    if(r.date != null && (typeof r.date !== "string" || r.date.length > 40 || /[<>&"]/.test(r.date))) return false;
    for(const [k, v] of Object.entries(r.picks)){ const s = p.steps.find(x => x.id === k); if(!s || !s.options.some(o => o.id === v && !o.trap)) return false; }
    for(let i = 0; i < r.si; i++) if(!r.picks[st[i].id]) return false;
    if((r.phase === "copy" || r.phase === "final") && !r.picks[st[r.si].id]) return false;
    return true;
  }catch(e){ return false; }
}
// Returns a usable run or null. If the run itself no longer fits the pack, the newest valid undo state is used.
// Runs saved before dates were stored get date null here; resumeRun() gives them today's date.
function cleanRun(raw){
  if(!isObj(raw)) return null;
  const norm = x => Object.assign(freshRun(raw.packId, raw.mode, raw.len), {date:null}, x, {history:[]});
  const hist = (Array.isArray(raw.history) ? raw.history : []).filter(h => isObj(h) && h.packId === raw.packId && h.mode === raw.mode && h.len === raw.len).map(norm).filter(validRun);
  const c = norm(raw); c.history = hist; c.updated = Number.isFinite(+raw.updated) && +raw.updated > 0 ? +raw.updated : Date.now();
  if(validRun(c)) return c;
  if(!hist.length) return null;
  const h = hist.pop(); h.history = hist; h.updated = c.updated; return h;
}
// what counts as a change of the run: everything but the time stamp and the P highlight
function runSig(r){ const {updated, focus, ...rest} = r; return JSON.stringify(rest); }
function readDisk(){ if(!STORE_OK) return null; try{ const s = JSON.parse(localStorage.getItem(RUNS_KEY) || "null"); return isObj(s) ? s : {}; }catch(e){ return null; } }
// slots full: the oldest finished text goes first, then the oldest unfinished lesson; `keep` is never dropped
// returns the dropped runs
function evict(map, keep){
  const extra = Object.keys(map).length - MAX_RUNS; if(extra <= 0) return [];
  const rank = r => isObj(r) && r.phase === "final" ? 0 : 1;
  return Object.entries(map).filter(([k]) => k !== keep)
    .sort(([, a], [, b]) => rank(a) - rank(b) || ((isObj(a) && +a.updated) || 0) - ((isObj(b) && +b.updated) || 0))
    .slice(0, extra).map(([k, r]) => { delete map[k]; return r; });
}
// read-modify-write of one entry (run = null deletes it: Verwerfen, Neu beginnen); returns the runs dropped from storage.
// Never writes an older state over a newer one (another tab saved this lesson later).
function writeEntry(id, run){
  const d = readDisk(); if(!d) return [];
  if(run && isObj(d[id]) && +d[id].updated > +run.updated) return [];
  if(run) d[id] = run; else delete d[id];
  const gone = evict(d, run ? id : null);
  try{ localStorage.setItem(RUNS_KEY, JSON.stringify(d)); }catch(e){ writeEntry.failed = true; }
  return gone;
}
// take over what other tabs saved. The lesson open in this tab is left alone, run AND saved signature: an older stored
// state never replaces it, and as long as this tab changes nothing it never writes it back (so it cannot overwrite the
// newer progress another tab saved, see saveRun). An older stored state never replaces a newer one in memory either.
function syncRuns(){
  const d = readDisk(); if(!d) return;
  const next = {};
  for(const [k, raw] of Object.entries(d)){
    if(R && k === R.packId) continue;
    const mine = runs[k], upd = isObj(raw) ? +raw.updated : NaN;
    if(mine && (upd === mine.updated || upd < mine.updated)){ next[k] = mine; continue; }   // unchanged, or older than what this tab has
    const c = cleanRun(raw); if(c){ next[c.packId] = c; savedSig[c.packId] = runSig(c); }
  }
  if(R) next[R.packId] = R;
  for(const k of Object.keys(savedSig)) if(!next[k]) delete savedSig[k];   // dropped in another tab
  runs = next;
}
(function loadRuns(){
  const raw = [];
  try{ const s = JSON.parse(localStorage.getItem(RUNS_KEY) || "null"); if(isObj(s)) raw.push(...Object.values(s)); }catch(e){}
  for(const r of raw){
    const c = cleanRun(r);
    if(c){ if(!runs[c.packId] || runs[c.packId].updated < c.updated) runs[c.packId] = c; }
    else if(isObj(r) && typeof r.packId === "string"){ const p = packById(r.packId); runNotes.push(p ? p.title : r.packId); }
  }
  evict(runs, null);
  for(const r of Object.values(runs)) savedSig[r.packId] = runSig(r);
  if(STORE_OK) try{ localStorage.setItem(RUNS_KEY, JSON.stringify(runs)); }catch(e){}   // the cleaned map, once at start
})();
// writes only when the run really changed; merely looking at a lesson keeps its time
// (an idle tab therefore never writes its older state over the newer one another tab saved)
function saveRun(){
  if(!R) return;
  const sig = runSig(R);
  if(sig === savedSig[R.packId] && runs[R.packId] === R) return;
  R.updated = Date.now(); savedSig[R.packId] = sig; runs[R.packId] = R;
  const gone = evict(runs, R.packId).concat(writeEntry(R.packId, R));
  // slots full and an unfinished lesson had to go: tell the teacher (a dropped finished text is expected, item 19)
  const lost = [...new Set(gone.filter(r => isObj(r) && r.phase !== "final" && r.packId !== R.packId && packById(r.packId)).map(r => r.packId))];
  if(lost.length){
    const names = lost.map(id => `„${packById(id).title}“`).join(", ");
    toast(`Nur ${MAX_RUNS} Stunden werden gespeichert: ${names} ${lost.length > 1 ? "wurden" : "wurde"} entfernt.`, "de", 10000);
  }
  if((!STORE_OK || writeEntry.failed) && !saveRun.warned){ saveRun.warned = true; toast("Speichern nicht möglich: Der Browser-Speicher ist voll oder gesperrt. Text am Ende mit „Copy text“ sichern.", "de", 8000); }
}
function dropRun(id){ delete runs[id]; delete savedSig[id]; writeEntry(id, null); }
function recentRuns(){ return Object.values(runs).filter(r => packById(r.packId)).sort((a, b) => b.updated - a.updated); }
// another tab saved or dropped a lesson: show it at once in the library and on the setup screen
window.addEventListener("storage", e => { if(e.key !== RUNS_KEY && e.key !== null) return; syncRuns(); if(view !== "run") render(); });

/* ===================== PACK HELPERS ===================== */
function P(){ return packById(R.packId); }
function curSteps(){ return activeSteps(P(), R.len); }
function cur(){ return curSteps()[R.si]; }
function optText(o){ const t = o.text; if(t == null) return null; if(typeof t === "string") return t; if(t.by && t.map) return t.map[R.picks[t.by]] ?? null; return null; }
function slotStep(slot){ return P().steps.find(s => s.slot === slot) || null; }
function slotText(slot){ const st = slotStep(slot); if(!st || !curSteps().includes(st)) return null; const id = R.picks[st.id]; if(!id) return null; const o = st.options.find(x => x.id === id); return o ? optText(o) : null; }
function pickedText(st){ const o = st.options.find(x => x.id === R.picks[st.id]); return o ? optText(o) || "" : ""; }
function gapDef(id){ return (P().gaps || []).find(x => x.id === id) || null; }
function gapVal(id){ return R.gaps[id] != null ? R.gaps[id] : null; }
function gapOrDefault(id){ const v = gapVal(id); if(v != null) return v; const g = gapDef(id); return g && g.default != null ? String(g.default) : null; }
const GAP_RE = /\{([A-Z][A-Z0-9_]*)\}/g;
function render_text(t, mode){ // mode: blank (decide: unknown gaps stay blank) | final (gap value or default)
  let h = esc(t);
  h = h.replace(/^###\s*(.+?)(\n|$)/gm, (m, a) => `<span class="h3">${a}</span>`);
  h = h.replace(/\n/g, "<br>");
  h = h.replace(/\[\[(.+?)\]\]/g, '<span class="pv">$1</span>');
  h = h.replace(/\{\{(.+?)\}\}/g, '<span class="sc">$1</span>');
  h = h.replace(GAP_RE, (m, k) => { const v = mode === "final" ? gapOrDefault(k) : gapVal(k); return v == null ? '<span class="blank" aria-label="gap"></span>' : esc(v); });
  // an empty gap blank keeps its following punctuation on the same line (no lone "." at a line start)
  h = h.replace(/(<span class="blank" aria-label="gap"><\/span>)([.,;:!?)\u201d\u2019]+)/g, '<span class="nowrap">$1$2</span>');
  return h;
}
function render_inline(s){ return render_text(s, "final"); }
function splitHead(t){ const m = /^###\s*(.+?)\n/.exec(t); return m ? {head:m[1], rest:t.slice(m[0].length)} : {head:null, rest:t}; }
function segs(t){ const parts = []; const re = /\{\{(.+?)\}\}/g; let m, last = 0;
  while((m = re.exec(t))){ if(m.index > last) parts.push({own:true, s:t.slice(last, m.index)}); parts.push({own:false, s:m[1]}); last = re.lastIndex; }
  if(last < t.length) parts.push({own:true, s:t.slice(last)}); return parts; }
function headHTML(h){ return h ? `<span class="h3 sc">${render_inline(h)}</span>` : ""; }
// Quotation marks and brackets in own stretches. ’ between two letters is an apostrophe, never a closing quote.
const OPENERS = {"“":"”", "‘":"’", "(":")", "[":"]"}, CLOSERS = {"”":"“", "’":"‘", ")":"(", "]":"["};
const isApos = (t, i) => t[i] === "’" && /\p{L}/u.test(t[i - 1] || "") && /\p{L}/u.test(t[i + 1] || "");
// Does `text` hold the still unmatched partner of `ch`? An opener looks forward for its closer, a closer looks backward for its opener.
function partnerIn(text, ch, forward){
  const other = OPENERS[ch] || CLOSERS[ch]; let depth = 0;
  for(let k = 0; k < text.length; k++){
    const i = forward ? k : text.length - 1 - k, x = text[i];
    if(isApos(text, i)) continue;
    if(x === ch) depth++;
    else if(x === other){ if(depth === 0) return true; depth--; }
  }
  return false;
}
// Which quotation marks / brackets of one own line stay visible? A mark is shown only if its partner is shown too:
//  - a pair inside the line: both shown only when they sit at its two edges (“I was ready.”), else both go under the line
//  - a mark whose partner is outside the line: shown if that partner is in the blue words before / after
// Returns the set of visible positions.
function visibleMarks(part, before, after){
  const stack = [], pairs = [], loose = [];
  for(let i = 0; i < part.length; i++){
    const c = part[i];
    if(OPENERS[c]) stack.push(i);
    else if(CLOSERS[c] && !isApos(part, i)){
      if(stack.length && part[stack[stack.length - 1]] === CLOSERS[c]) pairs.push([stack.pop(), i]); else loose.push(i);
    }
  }
  loose.push(...stack);
  const openEnd = /^[\s“‘(\[]*/.exec(part)[0].length;
  const closeStart = part.length - /(?:[”’)\]]+[.,;:!?]*)?\s*$/.exec(part)[0].length;
  const vis = new Set();
  for(const [o, c] of pairs) if(o < openEnd && c >= closeStart){ vis.add(o); vis.add(c); }
  for(const i of loose) if(OPENERS[part[i]] ? partnerIn(after, part[i], true) : partnerIn(before, part[i], false)) vis.add(i);
  return vis;
}
// At least as wide as its label (long class answers), at most as wide as the text column; the label itself never leaves the line (CSS).
function ownLine(w, label){ const em = Math.min(30, Math.max(1.4 + w * 0.85, label.length * 0.42)); return `<span class="ownline" role="img" data-w="${esc(label)}" style="--w:${em.toFixed(1)}em" aria-label="about ${w} words of your own"></span>`; }
// one piece of own words between visible marks: gap words at its start are shown inline (yellow), the rest becomes a dashed line
function ownPiece(s){
  let head = "";
  const lead = /^\s*(?:\S*\{[A-Z][A-Z0-9_]*\}\S*(?:\s+|$))+/.exec(s);
  if(lead){ const [, a, core, b] = /^(\s*)([\s\S]*?)(\s*)$/.exec(lead[0]); head = `${esc(a)}<span class="gv">${esc(plainText(core))}</span>${esc(b)}`; s = s.slice(lead[0].length); }
  const w = plainWords(s); if(!w) return head + esc(plainText(s.replace(GAP_RE, "")));
  const [, pre, , post] = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
  const uses = [...new Set([...s.matchAll(GAP_RE)].map(m => gapUse(s, m)).filter(Boolean))];
  return head + esc(pre) + ownLine(w, "~" + w + (uses.length ? " · use: " + uses.join(", ") : "")) + esc(post);
}
// the label of a gap inside an own stretch: a number gap is named with the words after it ("use: 25 kilometres", "use: 30 of us",
// "use: 40%"), so the class knows what the number is; one word, or two after "of" or an adjective ("12 local clubs"); stops at punctuation
const UNIT_STOP = new Set(["a", "an", "the", "and", "or", "but", "for", "from", "to", "in", "on", "at", "by", "with", "as", "each", "per", "which", "who", "that", "than", "outside", "every", "ago", "last", "is", "are", "was", "were"]);
function gapUse(s, m){
  const v = gapOrDefault(m[1]); if(!v) return "";
  const g = gapDef(m[1]); if(!g || g.type !== "number") return v;
  const rest = plainText(s.slice(m.index + m[0].length));
  if(/^\s*(%|per cent\b)/.test(rest)) return v + (rest.trim()[0] === "%" ? "%" : " per cent");
  const unit = [];
  for(const w of ((/^ +([^\n.,;:!?()“”"‘’]+)/.exec(rest) || [])[1] || "").trim().split(/\s+/)){
    const lw = w.toLowerCase();
    if(!/^[a-z]+$/i.test(w) || UNIT_STOP.has(lw)) break;
    unit.push(w);
    if(unit.length === 2 || (lw !== "of" && /s$|^(people|children|sheep|fish|men|women)$/.test(lw))) break;

  return unit.length ? v + " " + unit.join(" ") : v;
}
// Frame mode: one own-writing stretch. Line breaks stay; words become dashed lines labelled with the model length.
//  (a) gap words at the very start (also glued ones like "RR-{ORDER})." or "{AGE}-year-old") continue the scaffold: shown inline in yellow
//  (b) gaps further inside are only named in the label ("~13 · use: Sophie")
//  (c) quotation marks and brackets are shown only together with their partner (see visibleMarks; `before` / `after` = the
//      blue words around the stretch); a shown closing mark takes the punctuation right after it along
//  (d) focus markers [[ ]] never show inside an own stretch
function ownHTML(s, before, after){
  before = before || ""; after = after || "";
  s = s.replace(/\[\[|\]\]/g, "");
  return s.split(/(\n)/).map(part => {
    if(part === "\n") return "<br>";
    if(!plainWords(part)) return esc(plainText(part.replace(GAP_RE, "")));
    const vis = visibleMarks(part, before, after);
    let html = "", from = 0;
    for(let i = 0; i < part.length; i++){
      if(!vis.has(i)) continue;
      let j = i + 1; if(CLOSERS[part[i]]) while(/[.,;:!?]/.test(part[j] || "")) j++;
      html += ownPiece(part.slice(from, i)) + esc(part.slice(i, j)); from = j; i = j - 1;
    }
    return html + ownPiece(part.slice(from));
  }).join("");
}
// the blue words around each own stretch are its context for (c); own pieces without words are shown as they are
function frame_text(t){
  const {head, rest} = splitHead(t); const parts = segs(rest);
  const shown = parts.map(p => !p.own || !plainWords(p.s) ? plainText(p.s) : "");
  return headHTML(head) + parts.map((p, i) => p.own ? ownHTML(p.s, shown.slice(0, i).join(" "), shown.slice(i + 1).join(" ")) : `<span class="sc">${render_inline(p.s)}</span>`).join("");
}
function revealed_text(t){ const {head, rest} = splitHead(t); return headHTML(head) + segs(rest).map(p => p.own ? `<span class="ow">${render_inline(p.s)}</span>` : `<span class="sc">${render_inline(p.s)}</span>`).join(""); }
function ownWordCount(t){ return segs(splitHead(t).rest).filter(p => p.own).reduce((a, p) => a + plainWords(p.s.replace(GAP_RE, "")), 0); }
function plainText(t){ return t.replace(/\{\{|\}\}|\[\[|\]\]/g, "").replace(/^###\s*/gm, "").replace(GAP_RE, (m, k) => gapOrDefault(k) ?? ""); }
function plainWords(t){ return plainText(t).replace(/[“”"–…]/g, " ").split(/\s+/).filter(x => /[A-Za-z0-9]/.test(x)).length; }
// a join block (continuation, AUTHORING §15) is part of its paragraph: counted with it, so the totals are the same as per block
function countWords(){ let n = 0; P().order.forEach(s => { if(NOCOUNT.has(s)) return; const t = slotText(s); if(t) n += plainWords(t.replace(/^###.*$/gm, "")); }); return n; }
function countFocus(){ let n = 0; P().order.forEach(s => { const t = slotText(s); if(t) n += (t.match(/\[\[/g) || []).length; }); return n; }
/* ----- paragraphs and continuation blocks ("join": true) -----
   A join step's block continues the nearest earlier non-join block in `order` on the current path: same paragraph, separated
   by one space, no new line, no own margin word, one <p> on the final screen, one paragraph in the copy text. */
const isJoin = st => !!(st && st.join && st.slot);
const NOPARA = new Set(["title", "subject", "greeting", "signoff"]);
// the slots of `order` (only those of the current path that have a text when `filled`), grouped into paragraphs: [[slot, joined slot, …], …]
function slotGroups(slots, filled){
  const groups = [];
  for(const s of slots){
    const st = slotStep(s); if(!st || !curSteps().includes(st) || (filled && !slotText(s))) continue;
    if(isJoin(st) && groups.length) groups[groups.length - 1].push(s); else groups.push([s]);
  }
  return groups;
}
// the text of a paragraph so far: its blocks with one space between them
function groupText(g){ return g.map(slotText).filter(Boolean).join(" "); }
// the paragraph a slot belongs to (all its blocks on the current path, chosen or not)
function groupOf(slot){ return slotGroups(P().order, false).find(g => g.includes(slot)) || [slot]; }
// paragraphs of the body text (no title, subject, greeting or sign-off) on the current path
function bodyParas(filled){ return slotGroups(P().order, filled).filter(g => !NOPARA.has(g[0])); }
// Grades 9–12: the margin word in the exercise book is a short form of the five paragraph labels (the board shows the full label)
const MARGIN_SHORT = {"Introduction":"Intro", "Body paragraph 1":"Body 1", "Body paragraph 2":"Body 2", "Body paragraph 3":"Body 3", "Conclusion":"Conclusion"};
function marginWord(st){ return P().grade >= 9 && MARGIN_SHORT[st.part] ? MARGIN_SHORT[st.part] : st.part; }
// meta values as HTML for the board: a gap the class has not chosen yet is an empty line, never text
function metaLine(v){ return v == null ? "" : esc(String(v).replace(/\{TODAY\}/g, today())).replace(GAP_RE, (m, k) => { const x = gapVal(k); return x == null ? '<span class="blank"></span>' : esc(x); }); }
function metaFinal(v){ return v == null ? "" : String(v).replace(/\{TODAY\}/g, today()).replace(GAP_RE, (m, k) => gapOrDefault(k) ?? ""); }
// types whose header is copied before the first decision (layout screen)
function hasLayout(p){
  const m = p.meta || {};
  if(["email","report","blog","diary"].includes(p.textType)) return true;
  if(p.textType === "letter") return hasMailHead(p);
  if(p.textType === "postcard") return !!m.to;
  if(p.textType === "message") return !!(m.to || m.from);
  if(p.textType === "review") return !!(reviewRating(p) || m.byline);
  if(p.textType === "invitation") return !!m.to;
  return false;
}
// postcard address: meta.to as lines ("Name\nStreet\nTown" or an array)
function addrLines(p){ const v = (p.meta || {}).to; return v == null ? [] : (Array.isArray(v) ? v : String(v).split("\n")).map(x => String(x).trim()).filter(Boolean); }
// the date of a header (e-mail, letter to the editor, report, blog, diary): meta.date ("{TODAY}" or a fixed date), else the lesson day
function headerDate(p){ const m = p.meta || {}; return m.date ? metaFinal(m.date) : today(); }
const diaryDate = headerDate;   // diary: date line, and the optional "Dear Diary," (meta.dear)
// E-mail header (Matura format): To, From, Date, Subject. E-mails always; a letter to the editor when meta.to (the newspaper's address) is set.
function hasMailHead(p){ const m = p.meta || {}; return p.textType === "email" || (p.textType === "letter" && !!m.to); }
// [[label, value]] of the header without the subject line; `val` turns a meta value into the shown text (metaLine / metaFinal)
function mailHead(p, val){ const m = p.meta || {}; const rows = []; if(m.to) rows.push(["To", val(m.to)]); if(m.from) rows.push(["From", val(m.from)]); rows.push(["Date", val(m.date || "{TODAY}")]); return rows; }
// letter: the sender's full name (meta.name; older packs without a header: meta.from was the name)
function senderName(p){ const m = p.meta || {}; return m.name || (m.from && !hasMailHead(p) && !/@/.test(m.from) ? m.from : ""); }
// letter: sender name / town under the sign-off, only the parts the sign-off does not already name
function senderLine(p){
  const m = p.meta || {}; const so = plainText(slotText("signoff") || "");
  return [senderName(p), m.town].filter(x => x && !so.includes(metaFinal(x))).map(metaFinal).join(", ");
}
// review: star rating from meta.rating (whole stars 1–5; anything else shows no stars) and the optional by-line ("by …")
function reviewRating(p){ const n = Number((p.meta || {}).rating); return Number.isInteger(n) && n >= 1 && n <= 5 ? n : 0; }
function starsText(n){ return "★".repeat(n) + "☆".repeat(5 - n); }
function starsHTML(n){ return `<span class="stars" role="img" aria-label="${n} of 5 stars">${starsText(n)}</span>`; }
function reviewBy(p){ const v = (p.meta || {}).byline; return v == null || String(v).trim() === "" ? "" : "by " + String(v).trim().replace(/^by\s+/i, ""); }   // raw: metaLine / metaFinal fill the gaps
// review and blog: the line(s) under the title
function underTitle(p){ return p.textType === "blog" || p.textType === "review"; }
function titleWord(p){ return (p || P()).textType === "newspaper" ? "headline" : "title"; }
function bodyWords(t){ return plainText(t.replace(/^###.*\n/, "")).trim().split(/\s+/).filter(Boolean); }
function tailText(t, n){ const w = bodyWords(t); return (w.length > n ? "… " : "") + esc(w.slice(-n).join(" ")); }
function headText(t, n){ const w = bodyWords(t); return esc(w.slice(0, n).join(" ")) + (w.length > n ? " …" : ""); }
function typeTitle(p){ const tn = TYPE_NAMES[p.textType]; return p.title.toLowerCase().includes(tn.toLowerCase()) ? p.title : `${tn} · ${p.title}`; }

/* ===================== HISTORY (undo / redo) ===================== */
function stateCopy(){ const h = R.history; R.history = []; const c = JSON.parse(JSON.stringify(R)); R.history = h; return c; }
function snapshot(){ redo = []; R.history.push(stateCopy()); if(R.history.length > 80) R.history.shift(); }
// Nothing to undo = nothing happens, in every phase (a lesson is never left by undo; the task screen has its own button to the setup).
// The writing timer is not touched here: it belongs to the step (see timerKey) and render() stops it when the step changes.
function back(opts){
  if(view !== "run" || !R || !R.history.length) return;
  if(!(opts && opts.noRedo)) redo.push(stateCopy());
  const prev = R.history.pop(); const h = R.history; const focus = R.focus;
  R = Object.assign(prev, {history:h, focus}); closeOverlay(); render(); if(R.phase !== "copy") window.scrollTo(0, 0);
}
// restores exactly the state that the last back() undid
function forward(){
  if(view !== "run" || !R || !redo.length) return false;
  const next = redo.pop(); R.history.push(stateCopy()); const h = R.history; const focus = R.focus;
  R = Object.assign(next, {history:h, focus}); closeOverlay(); render(); if(R.phase !== "copy") window.scrollTo(0, 0);
  return true;
}

/* ===================== NAVIGATION ===================== */
function go(v){
  if(view === "run" && R && v !== "run"){ if(v === "setup") setupSel = {packId:R.packId, mode:R.mode, len:R.len}; saveRun(); R = null; redo = []; }
  disarm(); view = v; stopTimer(); closeOverlay(); render(); window.scrollTo(0, 0);
}
function fs(){ try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
function toggleFull(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }catch(e){} }
// start a new run for setupSel; replaces this pack's saved run
function startRun(){ const s = setupSel; R = freshRun(s.packId, s.mode, s.len); redo = []; disarm(); saveRun(); fs(); view = "run"; closeOverlay(); render(); window.scrollTo(0, 0); }
function resumeRun(id){
  syncRuns();   // another tab may have changed or dropped this lesson
  if(!runs[id]){ render(); return; }
  try{
    R = runs[id]; redo = []; disarm();
    if(!R.date){   // saved before lesson dates were stored: the lesson day becomes today (not a change of the run, so `updated` stays)
      R.date = fmtDate(Date.now()); R.history.forEach(h => { if(!h.date) h.date = R.date; });
      savedSig[id] = runSig(R); writeEntry(id, R);
    }
    fs(); view = "run"; closeOverlay(); render(); window.scrollTo(0, 0);
  }catch(e){ console.error(e); dropRun(id); R = null; view = "library"; closeOverlay(); render(); }
}

/* ===================== RENDER ROOT ===================== */

const screenKey = () => view + "|" + (R ? R.packId + "|" + R.phase + "|" + R.si : "");   // A+ / A- and other re-renders of the same screen keep the focus

}

// the author's note in the header: why building a text together on the board is worth a lesson now and then
function showWhy(){
  openOverlay(`<h2 id="dlg-h">Warum das Ganze?</h2>
    <p id="dlg-d">Die ehrliche Antwort zuerst: Eine Klasse, die Texte von der Leinwand abschreibt, gewinnt damit keinen Pädagogikpreis. Als Standardmethode, Woche für Woche, wäre Writing Room schlechter Unterricht, und so ist es nicht gedacht.</p>
    <p>Punktuell eingesetzt leistet es aber etwas, das beim stillen Lesen von Modelltexten verloren geht: Die Klasse sieht einem Text beim Entstehen zu. Sie stimmt über jeden Baustein ab, hört, warum die Redaktion eine Karte ablehnt, und diskutiert plötzlich über Topic Sentences, Anrede und Aufbau statt über einzelne Vokabeln. Die Struktur der Textsorte wird gemeinsam verhandelt, nicht vorgesetzt.</p>

}

function toast(msg, lang, ms){
  let t = $("toast"); if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  const place = () => { t.style.top = Math.max(8, Math.round($("top").getBoundingClientRect().bottom) + 8) + "px"; };   // just below the top bar
  place(); requestAnimationFrame(place);   // again after a screen change that is still being rendered (e.g. a lesson starting)
  t.lang = lang || "en-GB"; t.textContent = msg; t.setAttribute("aria-hidden", "true"); t.hidden = false;
  const lv = $("live"); if(lv){ lv.lang = t.lang; lv.textContent = ""; setTimeout(() => { lv.textContent = msg; }, 60); }   // announced once through the live region
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, ms || 2800);
}

/* ===================== LIBRARY ===================== */
const TYPE_ORDER = Object.keys(TYPE_NAMES);
// inside a Schulstufe: by text type, then by title
function byType(a, b){ return TYPE_ORDER.indexOf(a.textType) - TYPE_ORDER.indexOf(b.textType) || a.title.localeCompare(b.title, "en"); }
function relTime(t){
  const d = new Date(t), now = new Date(); const hm = d.toLocaleTimeString("de-AT", {hour:"2-digit", minute:"2-digit"});
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  return diff === 0 ? "heute " + hm : diff === 1 ? "gestern " + hm : d.toLocaleDateString("de-AT", {day:"numeric", month:"numeric"}) + " " + hm;
}
function phaseLabel(r){ const p = packById(r.packId); if(!p) return ""; if(r.phase === "final") return "fertig"; if(r.phase === "task" || r.phase === "layout") return "Aufgabe"; const st = activeSteps(p, r.len)[r.si]; return st ? `Schritt ${r.si + 1} von ${activeSteps(p, r.len).length}: ${st.part}${isJoin(st) ? " · continued" : ""}` : ""; }
// the lesson that Enter / PageDown in the library resumes: the most recent unfinished one
function resumeTarget(){ return recentRuns().find(r => r.phase !== "final") || null; }
// search: lower case, without accents; every word of the query must occur in title, titleDe, situation, theme, type, focus, level, Schulstufe,
// Gerüst / frame (packs with frame mode) or Matura / SRDP (grades 11–12).
// "3. Klasse", "3 Klasse", "3.Kl.", "Klasse 3" = the Austrian form (Schulstufe − 4); "7. Schulstufe" / "Schulstufe 7" pick the Schulstufe;
// filler words ("Grammatik", "Thema" …) are ignored; "present-perfect" also finds "present perfect"; a few German grammar words find the English labels
const fold = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const QUERY_FILL = new Set(["grammatik", "schwerpunkt", "thema", "paket", "pakete", "klasse", "klassen", "kl.", "schulstufe"]);
const QUERY_ALIAS = {perfekt:"perfect", vergangenheit:"past", zukunft:"future", gegenwart:"present", prasens:"present", futur:"future"};
function matchesQuery(p, q){
  const want = [];   // Schulstufen named in the query

function heftLines(p){

  if(hasMailHead(p)) L.push("→ first the header: " + mailHead(p, x => x).map(r => r[0]).join(", ") + (stepIndexOfSlot("subject") < 0 ? "" : subjectLater() ? ". Leave the Subject line open for now." : ". Then we choose the Subject line."));
  else if(p.textType === "report") L.push("→ first the header: To, From, Date" + (stepIndexOfSlot("subject") < 0 ? "" : subjectLater() ? ". Leave the Subject line open for now." : ". Then we choose the Subject line."));
  else if(p.textType === "postcard") L.push("→ draw a line down the middle of the page", "→ left half: the message · right half: the address" + (addrLines(p).length ? " and a stamp box" : ""));
  else if(p.textType === "message" && hasLayout(p)) L.push("→ first the header: " + [m.to ? "To" : "", m.from ? "From" : ""].filter(Boolean).join(" and "));
  else if(p.textType === "diary") L.push("→ under the heading: the date of the entry, on the right" + (m.dear ? `. Then “${plainText(m.dear)}” on its own line.` : ""));
  else if(p.textType === "invitation") L.push("→ draw a frame on a new page; write the invitation inside it" + (hasLayout(p) ? ", starting with the To line" : ""));
  if(p.order.includes("title") && stepIndexOfSlot("title") >= 0) L.push(titleLater() ? `→ leave 2 lines free for the ${tw.toUpperCase()} (we choose it at the end)` : `→ the ${tw} comes first`);
  if(p.textType === "blog") L.push("→ under the title: user name · date");
  if(p.textType === "review" && hasLayout(p)){ const n = reviewRating(p), by = reviewBy(p);
    L.push("→ under the title: " + [n ? `draw the stars ${starsText(n)}` : "", by ? `write “${metaFinal(by)}”` : ""].filter(Boolean).join(", then ")); }
  if(p.textType === "letter"){
    if(stepIndexOfSlot("greeting") >= 0) L.push("→ start with the greeting on its own line");
    if(stepIndexOfSlot("signoff") >= 0) L.push("→ at the end: the closing formula, then the name" + (m.town ? " and the town" : ""));
  }
  return L;
}

// validates and normalises a class answer; returns {value} or {err}
function cleanGap(g, input){

    if(!/^\d+$/.test(raw) && !/^\d{1,3}(?:[.,   ]\d{3})+$/.test(raw)) return {err:msg};
    const n = +raw.replace(/\D/g, "");

  if(g.minWords && v.split(" ").filter(w => /\p{L}/u.test(w)).length < g.minWords) return {err: g.minWordsMsg || (/\b(Mr|Ms|Mrs)\b/.test(g.q || "") ? "Please type Mr or Ms and a family name." : /First name and family name/.test(g.q || "") ? "Please type a first name and a family name." : `Please type at least ${g.minWords} words.`)};

    v = v.replace(/(^|[\s\-])(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase())   // every word start: Mary Jane, Anna-Lena
      // after an apostrophe only with exactly one letter before it (O'Neill, D'Arcy), never in contractions (Don't, We're, I'm)
      .replace(/(^|[\s\-])(\p{L})(['’])(?!(?:m|s|t|d|ll|ve|re)(?!\p{L}))(\p{Ll})/gu, (m, a, b, q, c) => a + b + q + c.toUpperCase())
      .replace(/(\s)(And|Or|Of|The|A|An|In|On|At|To|For)(?=\s)/g, (m, a, w) => a + w.toLowerCase());   // Pepper and Salt, not Pepper And Salt

}

  if(tt === "blog"){ const user = metaFinal(m.user || "our class");
    return `<article class="doc blog" lang="en-GB">${title ? `<h2>${render_text(title, "final")}</h2>` : ""}<div class="by"><span class="avatar" aria-hidden="true">${esc((user[0] || "?").toUpperCase())}</span>${esc(user)} · ${esc(date)}</div>${body.map(para).join("")}<div class="comments">Comments (0) · Leave a comment</div></article>`; }
  const h2 = title ? `<h2>${render_text(title, "final")}</h2>` : "";
  if(tt === "postcard"){
    const addr = addrLines(p);
    return `<article class="doc postcard" lang="en-GB"><div class="pc-msg">${h2}${body.map(para).join("")}</div><div class="pc-side"><div class="pc-stamp" aria-hidden="true">STAMP</div>${addr.length ? `<div class="pc-addr">${addr.map(l => `<span>${esc(metaFinal(l))}</span>`).join("")}</div>` : ""}</div></article>`;
  }
  if(tt === "message") return `<article class="doc message" lang="en-GB">${m.to || m.from ? `<dl class="mailhead">${m.to ? `<dt>To</dt><dd>${esc(metaFinal(m.to))}</dd>` : ""}${m.from ? `<dt>From</dt><dd>${esc(metaFinal(m.from))}</dd>` : ""}</dl>` : ""}${h2}${body.map(para).join("")}</article>`;
  if(tt === "diary") return `<article class="doc diary" lang="en-GB"><div class="ddate">${esc(diaryDate(p))}</div>${m.dear ? `<p>${esc(metaFinal(m.dear))}</p>` : ""}${h2}${body.map(para).join("")}</article>`;
  if(tt === "letter"){ const sender = senderLine(p); return `<article class="doc letter${mailhead ? " email" : ""}" lang="en-GB">${mailhead}${h2}${body.map(para).join("")}${sender ? `<p class="sender">${esc(sender)}</p>` : ""}</article>`; }
  if(tt === "review"){ const n = reviewRating(p), by = reviewBy(p);
    return `<article class="doc review" lang="en-GB">${m.publication ? `<div class="pub">${esc(metaFinal(m.publication))}</div>` : ""}${h2}${n ? `<div class="rating">${starsHTML(n)}</div>` : ""}${by ? `<div class="by">${esc(metaFinal(by))}</div>` : ""}${body.map(para).join("")}</article>`; }
  if(tt === "invitation") return `<article class="doc invitation" lang="en-GB">${m.to ? `<div class="inv-to">To: ${esc(metaFinal(m.to))}</div>` : ""}${h2}${body.map(para).join("")}</article>`;
  if(tt === "newspaper") return `<article class="doc" lang="en-GB"><div class="pub">${esc(m.publication || "The Class Times")} · ${esc(today())}</div>${title ? `<h2>${render_text(title, "final")}</h2>` : ""}<div class="by">By ${esc(metaFinal(m.byline) || "our class")}</div>${body.map(para).join("")}</article>`;
  const cls = tt === "essay" ? "essay" : (tt === "story" || tt === "description") ? "story" : "";
  return `<article class="doc ${cls}" lang="en-GB">${m.publication ? `<div class="pub">${esc(m.publication)}</div>` : ""}${title ? `<h2>${render_text(title, "final")}</h2>` : ""}${m.byline ? `<div class="by">By ${esc(metaFinal(m.byline))}</div>` : ""}${body.map(para).join("")}</article>`;
}
function renderFinal(){
  stopTimer();
  const p = P(); const L = p.lengths[R.len]; const words = countWords(), foc = countFocus(); const fmin = p.focus.min ? (p.focus.min[R.len] || 0) : 0;
  const frame = R.mode === "frame";
  const gl = guideLink(p);
  // frame mode: every student wrote their own text, so the model's counts are information, not ticks
  const auto = frame
    ? [["info", `Model text: <span class="num">${words}</span> words. Yours: ${esc(L.label.replace(/\s*words?\s*$/i, ""))}.`],
       ["info", `${esc(cap(p.focus.label))} in the model: <span class="num">${foc}</span>.${fmin ? ` Use at least ${esc(fmin)}.` : ""}`]]
    : [[words >= L.min - 3 && words <= L.max + 3 ? "ok" : "bad", `Words: <span class="num">${words}</span> (${esc(L.label)})`],
       [foc >= fmin ? "ok" : "bad", `${esc(cap(p.focus.label))}: <span class="num">${foc}</span>`]];
  // grades 9–12: every text has five paragraphs (continuation blocks belong to their paragraph)
  if(p.grade >= 9){ const n = bodyParas(true).length, what = "Introduction, three body paragraphs, Conclusion";
    auto.push(frame ? ["info", `Paragraphs in the model: <span class="num">${n}</span> (${what}). Yours: the same.`] : [n === 5 ? "ok" : "bad", `Paragraphs: <span class="num">${n}</span> (${what})`]); }
  const ticks = R.ticks || [];
  const items = auto.map(([k, t]) => `<li class="${k}"><span class="ic" aria-hidden="true">${k === "ok" ? "✓" : k === "bad" ? "!" : "i"}</span><span><span class="sr">${k === "ok" ? "OK: " : k === "bad" ? "Check: " : ""}</span>${t}</span></li>`)
    .concat(p.checks.map((c, i) => { const on = ticks.includes(i); return `<li class="tick${on ? " ok" : ""}" data-i="${i}" role="checkbox" tabindex="0" aria-checked="${on}"><span class="ic" aria-hidden="true">${on ? "✓" : ""}</span><span>${esc(c.en)}</span></li>`; }));
  $("main").innerHTML = `
  <h1 class="sr">Finished text</h1>
  <div class="final-grid">
    <div class="docwrap">${frame ? `<span class="eyebrow">Model text</span>` : ""}${docHTML()}</div>
    <aside class="side">
      <div class="note"><b>Editor’s checklist</b>${frame ? "Check YOUR text with a partner. Tick together what is true for your texts." : "Tick together (click a box): is everything in our text?"}</div>
      <ul class="checks">${items.join("")}</ul>
      <button class="secondary" id="copytxt">${COPY_LABEL}</button><span class="kbd" id="copymsg"></span>
      <button class="secondary" id="printtxt">Print</button>
      <button class="secondary" id="again2">Same pack again, other choices</button>
      <button class="secondary" id="tolib">← Library</button>
      ${gl ? `<div class="note guide"><b>Practise on your own</b>${esc(gl.what)}:<br><a href="${esc(gl.url)}" target="_blank" rel="noopener noreferrer">${esc(gl.short).replace("/", "<wbr>/")}</a>${gl.qr ? `<button class="qrbtn" id="qrbig" title="Show the QR code large">${qrSVG(gl.qr, "QR code for " + gl.short)}<span class="qrcap">Click for a large QR code</span></button>` : ""}</div>` : ""}
    </aside>
  </div>`;
  const toggleTick = li => {
    const i = +li.dataset.i; const on = !li.classList.contains("ok");
    R.ticks = (R.ticks || []).filter(x => x !== i).concat(on ? [i] : []);
    li.classList.toggle("ok", on); li.setAttribute("aria-checked", String(on)); li.querySelector(".ic").textContent = on ? "✓" : ""; saveRun();
  };
  document.querySelectorAll(".checks li.tick").forEach(li => {
    li.onclick = e => { toggleTick(li); if(e.detail) li.blur(); };   // a mouse click leaves no focus behind (Enter stays "next")
    li.onkeydown = e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); if(!e.repeat && performance.now() >= lockUntil) toggleTick(li); } };
  });
  $("copytxt").onclick = () => { const txt = finalPlain(); try{ navigator.clipboard.writeText(txt).then(copied, () => fallbackCopy(txt)); }catch(e){ fallbackCopy(txt); } };
  $("printtxt").onclick = () => { try{ window.print(); }catch(e){} };
  // like Restart: a second click within 8 s, and one undo brings the finished text back
  $("again2").onclick = () => armed("again2", "Sure? Click again", restartRun);
  $("tolib").onclick = () => go("library");
  if($("qrbig")) $("qrbig").onclick = () => infoOverlay(`<h2 id="dlg-h">Practise on your own</h2><p id="dlg-d">${esc(gl.what)}:<br><b>${esc(gl.short)}</b></p><div class="qrlarge">${qrSVG(gl.qr, "QR code for " + gl.short)}</div>`, "qr", "qrpanel");
}
function copied(){ const b = $("copytxt"); if(!b) return; b.textContent = "✓ Copied"; clearTimeout(copied.h); copied.h = setTimeout(() => { const b2 = $("copytxt"); if(b2) b2.textContent = COPY_LABEL; }, 2000); }
function finalPlain(){
  const p = P(); const out = []; const m = p.meta || {};
  const title = slotText("title"), subject = slotText("subject");
  const date = m.date ? metaFinal(m.date) : today();
  const head = [];
  if(hasMailHead(p)){ mailHead(p, metaFinal).forEach(([k, v]) => head.push(k + ": " + v)); if(subject) head.push("Subject: " + plainText(subject)); }
  else if(p.textType === "report"){ if(m.to) head.push("To: " + metaFinal(m.to)); if(m.from) head.push("From: " + metaFinal(m.from)); head.push("Date: " + date); if(subject) head.push("Subject: " + plainText(subject)); }
  else if(p.textType === "message"){ if(m.to) head.push("To: " + metaFinal(m.to)); if(m.from) head.push("From: " + metaFinal(m.from)); }
  else if(p.textType === "diary"){ head.push(diaryDate(p)); if(m.dear) head.push(metaFinal(m.dear)); }
  else if(p.textType === "review"){ if(m.publication) head.push(metaFinal(m.publication)); }
  else if(p.textType === "invitation"){ if(m.to) head.push("To: " + metaFinal(m.to)); }
  else if(p.textType === "newspaper") head.push(`${metaFinal(m.publication) || "The Class Times"} · ${today()}`);   // masthead and by-line as in docHTML
  if(head.length) out.push(head.join("\n"));
  if(title) out.push(plainText(title));
  if(p.textType === "newspaper") out.push("By " + (metaFinal(m.byline) || "our class"));
  if(p.textType === "blog") out.push(`${metaFinal(m.user || "our class")} · ${date}`);
  if(p.textType === "review"){ const n = reviewRating(p), by = reviewBy(p); const r = [n ? `Rating: ${n}/5` : "", by ? metaFinal(by) : ""].filter(Boolean); if(r.length) out.push(r.join("\n")); }
  slotGroups(p.order, true).filter(g => !NOCOUNT.has(g[0])).forEach(g => out.push(g.map(s => plainText(slotText(s))).join(" ")));
  if(p.textType === "letter" && senderLine(p)) out[out.length - 1] += "\n" + senderLine(p);
  if(p.textType === "postcard" && addrLines(p).length) out.push(addrLines(p).map(metaFinal).join("\n"));
  out.push("Model text: Writing Room by Bernhard Gmeiner, CC BY-NC-SA 4.0");
  return out.join("\n\n");
}
function fallbackCopy(txt){
  let ta = $("copyta");
  if(!ta){ ta = document.createElement("textarea"); ta.id = "copyta"; ta.rows = 8; ta.style.width = "100%"; $("copymsg").after(ta); }
  ta.value = txt; ta.select(); let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  if(ok){ copied(); ta.remove(); } else $("copymsg").textContent = "Select the text below and copy it:";
}

/* ===================== TOOLS & KEYS ===================== */
// Two-click confirmation: the first click changes the label, a second click within 8 s runs fn.
const armState = {};
function armed(id, label, fn){
  const now = Date.now(); const el = $(id); const st = armState[id];
  if(!st || now - st.t > 8000){
    armState[id] = {t:now, label:el ? el.textContent : "", armedLabel:label}; if(el) el.textContent = label;
    const am = $("arm-msg"); if(am) am.textContent = label;
    setTimeout(() => { const e2 = $(id); if(armState[id] && armState[id].t === now){ if(e2) e2.textContent = armState[id].label; delete armState[id]; const a2 = $("arm-msg"); if(a2) a2.textContent = ""; } }, 8000);
    return;
  }
  if(now - st.t < 450) return;
  delete armState[id]; const am = $("arm-msg"); if(am) am.textContent = ""; fn();
}
// after a re-render an armed button keeps showing its "click again" label
function disarm(){ for(const id of Object.keys(armState)) delete armState[id]; const am = $("arm-msg"); if(am) am.textContent = ""; }
function reapplyArmed(){ for(const [id, st] of Object.entries(armState)){ const el = $(id); if(el && Date.now() - st.t <= 8000) el.textContent = st.armedLabel; } }
// a fresh run of the same pack, mode and length; the old state stays in the history, so one undo brings it back
function restartRun(){ snapshot(); const h = R.history, f = R.focus; R = Object.assign(freshRun(R.packId, R.mode, R.len), {history:h, focus:f}); redo = []; stopTimer(); render(); window.scrollTo(0, 0); }
function bindTools(){
  const b = (id, fn) => { const el = $(id); if(el) el.onclick = e => { fn(e); try{ el.blur(); }catch(_){} }; };
  b("t-home", () => go("library"));
  b("t-back", () => back());
  b("t-task", showTask);
  b("t-help", showHelp);
  b("t-focus", () => { R.focus = !R.focus; render(); });
  b("t-plus", () => zoomBy(0.1));
  b("t-minus", () => zoomBy(-0.1));
  b("t-full", toggleFull);
  b("t-reset", () => armed("t-reset", "Sure? Click again", restartRun));
}
// clicks obey the same short lock as keys: no accidental double-click votes, cancels or length changes (A+ / A− are harmless).
// Not in the library: there a quick second click (after "Filter zurücksetzen", closing the info window) is meant.
document.addEventListener("click", e => {
  if(view !== "library" && performance.now() < lockUntil && e.target.closest && e.target.closest("button:not(#t-plus):not(#t-minus), li.tick")){ e.preventDefault(); e.stopPropagation(); }
}, true);
let mouseTimer = null;
document.addEventListener("mousemove", () => { document.body.classList.add("mouse"); clearTimeout(mouseTimer); mouseTimer = setTimeout(() => document.body.classList.remove("mouse"), 1500); });
document.addEventListener("keydown", e => {
  const kind = overlayKind();
  if(e.key === "Tab" && kind){
    const f = [...$("overlay").querySelectorAll('button, a[href], input, select, summary, [tabindex="0"]')].filter(x => !x.disabled && x.offsetParent !== null);
    if(f.length){ const i = f.indexOf(document.activeElement); const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1); e.preventDefault(); f[n].focus(); }
    return;
  }
  const tag = e.target && e.target.tagName;
  const locked = e.repeat || performance.now() < lockUntil;
  // Esc only closes windows; it never undoes (teachers press it to leave full screen, remotes send it)
  if(e.key === "Escape"){
    if(tag === "TEXTAREA" || (tag === "INPUT" && !kind)) return;   // the library search field clears itself
    e.preventDefault();
    if(locked || !kind) return;
    if(kind === "gap") cancelGap(); else closeInfo();
    return;
  }
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if(prefs.keys === false && /^[A-Za-z0-9?+\-=]$/.test(k)) return;   // single-key shortcuts off (WCAG 2.1.4); Enter, arrows, Page keys, Backspace and Esc stay
  const nextKey = k === "Enter" || k === "ArrowRight" || k === "PageDown";
  const backKey = k === "Backspace" || k === "ArrowLeft" || k === "PageUp";
  // Enter on a focused control (button, summary, link, checklist item) activates that control natively;
  // PageDown and → are never taken by a focused control (the presenter's "weiter")
  const onControl = !!(e.target && e.target.closest && e.target.closest("button, summary, a, [role=checkbox]"));
  const enterOnControl = k === "Enter" && onControl;
  if(locked){ if(nextKey || backKey || k === " ") e.preventDefault(); return; }
  if(kind){
    if((kind === "task" && (k === "t" || k === "T")) || (kind === "help" && k === "?") || (kind === "trap" && (k === "x" || k === "X"))){ e.preventDefault(); closeInfo(); return; }
    if(kind === "spot"){ const o = cardForKey(e); if(o){ e.preventDefault(); closeOverlay(); choose(o.id); if(view === "run" && R.phase === "decide" && overlayKind() === "") render(); return; } }
    if(enterOnControl) return;
    if(kind === "gap"){   // the input has no focus yet (lock) or the teacher clicked elsewhere in the window
      if(k === "Enter" || k === "PageDown"){ e.preventDefault(); if(gapKeys) gapKeys.submit(); }
      else if(k === "PageUp"){ e.preventDefault(); cancelGap(); }
      return;
    }
    if(k === "PageUp"){ e.preventDefault(); closeInfo(); return; }   // presenter "zurück" closes the window like Esc (gap: see above)
    if(nextKey){ const b = $("again"); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(k === "f" || k === "F"){ toggleFull(); return; }
  if(k === "+" || k === "="){ zoomBy(0.1); return; }
  if(k === "-"){ zoomBy(-0.1); return; }
  if(view === "library"){
    if(k === "PageDown" || (k === "Enter" && !onControl)){ const r = resumeTarget(); if(r){ e.preventDefault(); resumeRun(r.packId); } }
    return;
  }
  if(view === "setup"){
    // Enter on a Modus / Länge button that is not selected yet (reached with Tab) selects it, like any button.
    // Enter on the selected one (it keeps the focus after a mouse click) = the primary action.
    const choice = e.target.closest && e.target.closest(".opt-c");
    if(k === "Enter" && choice && choice.getAttribute("aria-pressed") !== "true"){ e.preventDefault(); choice.click(); return; }
    if(k === "PageDown" || (k === "Enter" && (!onControl || choice))){ e.preventDefault(); setupPrimary(); }
    return;
  }
  if(view !== "run") return;
  if(k === "?"){ showHelp(); return; }
  if(k === "t" || k === "T"){ showTask(); return; }
  if(k === "p" || k === "P"){ R.focus = !R.focus; render(); return; }
  if(R.phase === "decide"){
    if(e.shiftKey && /^(Digit|Numpad)[1-4]$/.test(e.code || "")){ e.preventDefault(); showSpot(+e.code.slice(-1) - 1); return; }
    const o = cardForKey(e); if(o){ e.preventDefault(); choose(o.id); return; }
  }
  if(R.phase === "copy" && (k === "x" || k === "X")){ e.preventDefault(); const tc = $("trapcheck"); if(tc) tc.click(); return; }
  if(R.phase === "copy" && $("reveal")){
    if(/^[2358]$/.test(k)){ e.preventDefault(); startTimer(+k); return; }
    if(k === "0"){ e.preventDefault(); stopTimerUI(); return; }
  }
  // the finished text is read with a presenter remote: PageDown/PageUp/Space scroll, they never undo
  if(R.phase === "final" && (k === "PageDown" || k === "PageUp" || (k === " " && !onControl))){
    e.preventDefault(); window.scrollBy({top:(k === "PageUp" ? -1 : 1) * window.innerHeight * 0.8, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return;
  }
  if(nextKey){
    if(enterOnControl) return;
    e.preventDefault();
    if(forward()) return;
    if(R.phase === "task") nextFromTask();
    else if(R.phase === "layout") nextFromLayout();
    else if(R.phase === "copy"){ if($("reveal")) reveal(); else nextFromCopy(); }
    return;
  }
  if(backKey){ e.preventDefault(); back(); }
});
const refit = () => {
  if(view !== "run" || !R) return;
  if(overlayKind() === "spot"){ fitSpot(); return; }
  if(overlayKind() === "task"){ fitTaskPanel(); return; }
  if(overlayKind()) return;
  if(R.phase === "decide") fitDecide(); else if(R.phase === "task") fitTask(); else if(R.phase === "copy") placeCopy();
};
let refitRaf = 0;
const refitSoon = () => { cancelAnimationFrame(refitRaf); refitRaf = requestAnimationFrame(refit); };   // one refit per frame while resizing
window.addEventListener("resize", refitSoon);
document.addEventListener("fullscreenchange", refitSoon);
if(document.fonts){ if(document.fonts.ready) document.fonts.ready.then(refit); try{ document.fonts.addEventListener("loadingdone", refit); }catch(e){} }

try{ render(); }catch(e){ console.error(e); view = "library"; R = null; render(); }
</script>
